name: validate-skills

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run validator
        run: |
          chmod +x scripts/validate.sh
          ./scripts/validate.sh

  ts-smoke:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        pkg: [phi-log-filter, webhook-verify, audit-trail, consent-gate]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: cd ts/${{ matrix.pkg }} && node --test test/smoke.test.js

  cli-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: bash tests/cli.bats

  site-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node scripts/build_site.js
      - run: test -s docs/site/skills.json
      - run: node -e "const d=JSON.parse(require('fs').readFileSync('docs/site/skills.json','utf8')); if(d.skills.length<25) throw new Error('skills.json has '+d.skills.length+' entries')"

  smoke-install:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        ide: [claude-code, cursor, codex, gemini]
    steps:
      - uses: actions/checkout@v4
      - name: Dry-run install for ${{ matrix.ide }}
        run: |
          chmod +x install.sh
          mkdir -p "$HOME/.claude" "$HOME/.cursor" "$HOME/.codex" "$HOME/.gemini"
          ./install.sh --ide ${{ matrix.ide }} --dry-run
